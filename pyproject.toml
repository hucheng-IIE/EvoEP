[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evoep"
version = "1.0.0"
description = "Temporal evolution-aware open-set event prediction"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["torch>=2.4", "numpy>=1.24", "transformers>=4.41", "scikit-learn>=1.3", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["evoep*"]
